<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="582" viewBox="0 0 1200 582" role="img" aria-labelledby="title desc">
<title id="title">Home Studio release pipeline</title><desc id="desc">Pull request review and CI lead to beta, then an explicitly requested release candidate with fuzzing, then approved stable promotion. Stable copies accepted RC assets without rebuilding. Required failures block the relevant gate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9bed4"/></marker></defs>
<rect width="1200" height="582" rx="24" fill="#0b1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="44" y="40" fill="#67d9ff" font-size="15" font-weight="700" text-anchor="start">HOME STUDIO / RELEASE CONTRACT</text><text x="44" y="86" fill="#edf6ff" font-size="35" font-weight="750" text-anchor="start">Reviewed source → verified release</text><text x="44" y="122" fill="#a9bed4" font-size="20" font-weight="400" text-anchor="start">Every stage has its own gate. Browser success alone does not publish a release.</text><rect x="44" y="165" width="260" height="284" rx="20" fill="#142238" stroke="#29405c"/><text x="66" y="200" fill="#67d9ff" font-size="17" font-weight="700" text-anchor="start">01</text><text x="66" y="244" fill="#edf6ff" font-size="26" font-weight="700" text-anchor="start">Pull request</text><text x="66" y="290" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Review source changes</text><text x="66" y="325" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Run quality + package CI</text><text x="66" y="360" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Run the browser matrix</text><path d="M66 393H282" stroke="#29405c"/><text x="66" y="426" fill="#67d9ff" font-size="17" font-weight="600" text-anchor="start">Merge reviewed source</text><path d="M308 310H323" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><rect x="328" y="165" width="260" height="284" rx="20" fill="#142238" stroke="#29405c"/><text x="350" y="200" fill="#5de2bd" font-size="17" font-weight="700" text-anchor="start">02</text><text x="350" y="244" fill="#edf6ff" font-size="26" font-weight="700" text-anchor="start">Beta</text><text x="350" y="290" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Main push starts the run</text><text x="350" y="325" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Recheck + build packages</text><text x="350" y="360" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Publish a prerelease</text><path d="M350 393H566" stroke="#29405c"/><text x="350" y="426" fill="#5de2bd" font-size="17" font-weight="600" text-anchor="start">Validate the candidate</text><path d="M592 310H607" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><rect x="612" y="165" width="260" height="284" rx="20" fill="#142238" stroke="#29405c"/><text x="634" y="200" fill="#b9a0ff" font-size="17" font-weight="700" text-anchor="start">03</text><text x="634" y="244" fill="#edf6ff" font-size="26" font-weight="700" text-anchor="start">Release candidate</text><text x="634" y="290" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Request an RC explicitly</text><text x="634" y="325" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Recheck + rebuild + fuzz</text><text x="634" y="360" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Bind source and evidence</text><path d="M634 393H850" stroke="#29405c"/><text x="634" y="426" fill="#b9a0ff" font-size="17" font-weight="600" text-anchor="start">Accept the RC payloads</text><path d="M876 310H891" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><rect x="896" y="165" width="260" height="284" rx="20" fill="#142238" stroke="#29405c"/><text x="918" y="200" fill="#ffd17b" font-size="17" font-weight="700" text-anchor="start">04</text><text x="918" y="244" fill="#edf6ff" font-size="26" font-weight="700" text-anchor="start">Stable</text><text x="918" y="290" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Approve release promotion</text><text x="918" y="325" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Verify the accepted RC</text><text x="918" y="360" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Copy its exact asset bytes</text><path d="M918 393H1134" stroke="#29405c"/><text x="918" y="426" fill="#ffd17b" font-size="17" font-weight="600" text-anchor="start">No rebuild at promotion</text><rect x="44" y="480" width="1112" height="76" rx="14" fill="#101c2c" stroke="#29405c"/><text x="66" y="512" fill="#ffd17b" font-size="16" font-weight="700" text-anchor="start">FAIL CLOSED</text><text x="212" y="512" fill="#edf6ff" font-size="20" font-weight="400" text-anchor="start">Failed, missing or unexpectedly skipped required checks block the gate.</text><text x="66" y="540" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">Stable keeps the verified RC payloads byte for byte, including their existing manifest.</text></g></svg>

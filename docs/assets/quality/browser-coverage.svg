<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="658" viewBox="0 0 1200 658" role="img" aria-labelledby="title desc">
<title id="title">Home Studio v0.6.4 browser and platform coverage</title><desc id="desc">Seventy-seven required acceptance lanes consist of three operating-system package and install lanes plus seventy-four browser profiles. Each browser profile runs a six-room viewer, a twenty-four-room viewer, and a planner case, totaling two hundred twenty-two browser cases. Linux, Windows and macOS, including Apple Silicon and Intel, are represented. Mobile profiles are emulated and coverage is representative rather than exhaustive.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9bed4"/></marker></defs>
<rect width="1200" height="658" rx="24" fill="#0b1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="44" y="40" fill="#67d9ff" font-size="15" font-weight="700" text-anchor="start">HOME STUDIO / v0.6.4 COVERAGE SNAPSHOT</text><text x="44" y="86" fill="#edf6ff" font-size="35" font-weight="750" text-anchor="start">77 acceptance lanes · 222 browser cases</text><text x="44" y="122" fill="#a9bed4" font-size="20" font-weight="400" text-anchor="start">Representative environments and real rendering checks — not every browser or device.</text><rect x="44" y="158" width="350" height="83" rx="20" fill="#142238" stroke="#29405c"/><text x="64" y="191" fill="#edf6ff" font-size="25" font-weight="650" text-anchor="start">Linux</text><text x="64" y="221" fill="#67d9ff" font-size="18" font-weight="400" text-anchor="start">Hosted desktop environments</text><rect x="425" y="158" width="350" height="83" rx="20" fill="#142238" stroke="#29405c"/><text x="445" y="191" fill="#edf6ff" font-size="25" font-weight="650" text-anchor="start">Windows</text><text x="445" y="221" fill="#5de2bd" font-size="18" font-weight="400" text-anchor="start">Hosted desktop environments</text><rect x="806" y="158" width="350" height="83" rx="20" fill="#142238" stroke="#29405c"/><text x="826" y="191" fill="#edf6ff" font-size="25" font-weight="650" text-anchor="start">macOS</text><text x="826" y="221" fill="#b9a0ff" font-size="18" font-weight="400" text-anchor="start">Apple Silicon + Intel lanes</text><rect x="44" y="269" width="330" height="141" rx="20" fill="#142238" stroke="#29405c"/><text x="67" y="316" fill="#67d9ff" font-size="43" font-weight="750" text-anchor="start">3</text><text x="122" y="308" fill="#edf6ff" font-size="24" font-weight="650" text-anchor="start">install lanes</text><text x="67" y="350" fill="#a9bed4" font-size="20" font-weight="400" text-anchor="start">Package and install checks</text><text x="67" y="381" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">One for each OS family</text><rect x="420" y="269" width="736" height="141" rx="20" fill="#142238" stroke="#29405c"/><text x="445" y="316" fill="#5de2bd" font-size="43" font-weight="750" text-anchor="start">74</text><text x="521" y="307" fill="#edf6ff" font-size="24" font-weight="650" text-anchor="start">browser profiles</text><text x="445" y="352" fill="#a9bed4" font-size="23" font-weight="400" text-anchor="start">× 3 cases per profile</text><text x="821" y="336" fill="#5de2bd" font-size="42" font-weight="750" text-anchor="start">= 222</text><text x="827" y="377" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">browser cases</text><rect x="44" y="439" width="350" height="120" rx="20" fill="#142238" stroke="#29405c"/><text x="64" y="469" fill="#67d9ff" font-size="16" font-weight="700" text-anchor="start">01</text><text x="64" y="508" fill="#edf6ff" font-size="25" font-weight="650" text-anchor="start">6-room viewer</text><text x="64" y="540" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">18 linked lights</text><rect x="425" y="439" width="350" height="120" rx="20" fill="#142238" stroke="#29405c"/><text x="445" y="469" fill="#5de2bd" font-size="16" font-weight="700" text-anchor="start">02</text><text x="445" y="508" fill="#edf6ff" font-size="25" font-weight="650" text-anchor="start">24-room viewer</text><text x="445" y="540" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">72 linked lights</text><rect x="806" y="439" width="350" height="120" rx="20" fill="#142238" stroke="#29405c"/><text x="826" y="469" fill="#b9a0ff" font-size="16" font-weight="700" text-anchor="start">03</text><text x="826" y="508" fill="#edf6ff" font-size="25" font-weight="650" text-anchor="start">Planner</text><text x="826" y="540" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">2 floors · 16 rooms · 256 items</text><text x="44" y="601" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Pinned versions and selected channels • Native browsers and Playwright have distinct roles.</text><text x="44" y="632" fill="#ffd17b" font-size="19" font-weight="400" text-anchor="start">Phone/tablet profiles emulate viewport and input; they are not physical-device certification.</text></g></svg>

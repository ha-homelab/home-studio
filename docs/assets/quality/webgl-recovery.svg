<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="686" viewBox="0 0 1200 686" role="img" aria-labelledby="title desc">
<title id="title">Viewer interaction and WebGL recovery checks</title><desc id="desc">Read left to right across the top, then right to left across the bottom. Cold load, drag and orbit, and Editor interaction precede deliberate context loss. The viewer pauses while lost, preserves CPU and project data, restores GPU resources, checks Editor cutaway, full Editor and Home, then detaches cleanly. The acceptance scenario includes two fresh viewer cycles. Diagnostic replays cannot replace a failed original result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9bed4"/></marker></defs>
<rect width="1200" height="686" rx="24" fill="#0b1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="44" y="40" fill="#67d9ff" font-size="15" font-weight="700" text-anchor="start">HOME STUDIO / VIEWER LIFECYCLE</text><text x="44" y="86" fill="#edf6ff" font-size="35" font-weight="750" text-anchor="start">Render. Interact. Interrupt. Recover.</text><text x="44" y="122" fill="#a9bed4" font-size="20" font-weight="400" text-anchor="start">The checks follow real UI actions through deliberate WebGL context loss and cleanup.</text><rect x="44" y="166" width="350" height="178" rx="20" fill="#142238" stroke="#29405c"/><text x="66" y="200" fill="#67d9ff" font-size="17" font-weight="700" text-anchor="start">01</text><text x="66" y="242" fill="#edf6ff" font-size="28" font-weight="700" text-anchor="start">Cold load</text><text x="66" y="284" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Connect the fictional home</text><text x="66" y="315" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Render its lights and geometry</text><rect x="425" y="166" width="350" height="178" rx="20" fill="#142238" stroke="#29405c"/><text x="447" y="200" fill="#5de2bd" font-size="17" font-weight="700" text-anchor="start">02</text><text x="447" y="242" fill="#edf6ff" font-size="28" font-weight="700" text-anchor="start">Drag + orbit</text><text x="447" y="284" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Move the real camera</text><text x="447" y="315" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Finish on the resting frame</text><rect x="806" y="166" width="350" height="178" rx="20" fill="#142238" stroke="#29405c"/><text x="828" y="200" fill="#b9a0ff" font-size="17" font-weight="700" text-anchor="start">03</text><text x="828" y="242" fill="#edf6ff" font-size="28" font-weight="700" text-anchor="start">Enter Editor</text><text x="828" y="284" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Change mode and wall height</text><text x="828" y="315" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Verify input and completed draws</text><rect x="806" y="408" width="350" height="178" rx="20" fill="#142238" stroke="#29405c"/><text x="828" y="442" fill="#ffd17b" font-size="17" font-weight="700" text-anchor="start">04</text><text x="828" y="484" fill="#edf6ff" font-size="28" font-weight="700" text-anchor="start">Lose the context</text><text x="828" y="526" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Pause rendering while lost</text><text x="828" y="557" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Preserve project and CPU state</text><rect x="425" y="408" width="350" height="178" rx="20" fill="#142238" stroke="#29405c"/><text x="447" y="442" fill="#5de2bd" font-size="17" font-weight="700" text-anchor="start">05</text><text x="447" y="484" fill="#edf6ff" font-size="28" font-weight="700" text-anchor="start">Restore + revisit</text><text x="447" y="526" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Upload fresh GPU resources</text><text x="447" y="557" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Check cutaway → full → Home</text><rect x="44" y="408" width="350" height="178" rx="20" fill="#142238" stroke="#29405c"/><text x="66" y="442" fill="#67d9ff" font-size="17" font-weight="700" text-anchor="start">06</text><text x="66" y="484" fill="#edf6ff" font-size="28" font-weight="700" text-anchor="start">Clean up</text><text x="66" y="526" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Detach the generated viewer</text><text x="66" y="557" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">Verify the dashboard stays alive</text><path d="M399 255H417" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 255H798" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><path d="M981 354L981 394" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><path d="M798 497H780" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><path d="M417 497H399" fill="none" stroke="#a9bed4" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="627" fill="#edf6ff" font-size="20" font-weight="400" text-anchor="start">Two fresh viewer cycles; intentional recovery and all three restored modes must complete.</text><text x="44" y="659" fill="#ffd17b" font-size="19" font-weight="400" text-anchor="start">A diagnostic replay or a late frame cannot replace the original case result.</text></g></svg>

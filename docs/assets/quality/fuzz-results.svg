<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="658" viewBox="0 0 1200 658" role="img" aria-labelledby="title desc">
<title id="title">Verified release-candidate fuzz execution counts</title><desc id="desc">The two sixty-second fuzz campaigns in release-candidate run 38932840800 executed 1,137,499 project-validation inputs and 802,873 wall-geometry inputs, totaling 1,940,372. These are engine execution counts, not browser cases, unique bugs or proof of exhaustive code-path coverage. Full RC qualification and stable promotion are separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9bed4"/></marker></defs>
<rect width="1200" height="658" rx="24" fill="#0b1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="44" y="40" fill="#67d9ff" font-size="15" font-weight="700" text-anchor="start">HOME STUDIO / RC FUZZING</text><text x="44" y="86" fill="#edf6ff" font-size="35" font-weight="750" text-anchor="start">1,940,372 executed inputs</text><text x="44" y="122" fill="#a9bed4" font-size="20" font-weight="400" text-anchor="start">Two 60-second engine campaigns · RC run 38932840800 · 16 October 2026</text><rect x="44" y="158" width="1112" height="325" rx="20" fill="#142238" stroke="#29405c"/><text x="68" y="218" fill="#edf6ff" font-size="26" font-weight="650" text-anchor="start">Project validation</text><text x="1132" y="218" fill="#5de2bd" font-size="28" font-weight="750" text-anchor="end">1,137,499</text><rect x="68" y="243" width="1064" height="34" rx="10" fill="#0b1626" stroke="#0b1626"/><rect x="68" y="243" width="1064.0" height="34" rx="10" fill="#5de2bd" stroke="#5de2bd"/><text x="68" y="308" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">60-second campaign</text><text x="68" y="350" fill="#edf6ff" font-size="26" font-weight="650" text-anchor="start">Wall geometry</text><text x="1132" y="350" fill="#b9a0ff" font-size="28" font-weight="750" text-anchor="end">802,873</text><rect x="68" y="375" width="1064" height="34" rx="10" fill="#0b1626" stroke="#0b1626"/><rect x="68" y="375" width="751.0" height="34" rx="10" fill="#b9a0ff" stroke="#b9a0ff"/><text x="68" y="440" fill="#a9bed4" font-size="18" font-weight="400" text-anchor="start">60-second campaign</text><text x="44" y="532" fill="#67d9ff" font-size="16" font-weight="700" text-anchor="start">WHAT THE NUMBERS MEAN</text><text x="44" y="568" fill="#edf6ff" font-size="20" font-weight="400" text-anchor="start">Fuzz engines repeatedly execute generated inputs against project validation and geometry.</text><text x="44" y="600" fill="#ffd17b" font-size="20" font-weight="400" text-anchor="start">Executions are not browser cases, unique bugs, or proof that every code path was covered.</text><text x="44" y="632" fill="#a9bed4" font-size="19" font-weight="400" text-anchor="start">These target results stand apart from full RC qualification and stable promotion.</text></g></svg>

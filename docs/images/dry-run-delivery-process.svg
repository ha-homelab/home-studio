<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 980" role="img" aria-labelledby="title desc">
  <title id="title">From a guarded device action to a reviewable release</title>
  <desc id="desc">Six steps describe the Dry run delivery process. First define the host boundary and build translations. Second verify blocked commands using fake Home Assistant services. Third check browser storage, language changes and right-to-left layouts. Fourth validate documentation, vector diagrams and the extracted source archive. Fifth submit signed changes for pull request review. Sixth require continuous integration and release acceptance before publication. These are workflow steps, not a statement that a release has been published. Live readings remain separate from device commands throughout.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#52667d"/></marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172f49}
    .title{font-size:32px;font-weight:750}.subtitle{font-size:19px;fill:#52667d}
    .step{font-size:14px;font-weight:750;letter-spacing:1.8px}.heading{font-size:25px;font-weight:700}
    .body{font-size:18px}.small{font-size:16px;fill:#52667d}.number{font-size:24px;font-weight:750;fill:#fff}
    .card{stroke-width:1.5}.flow{fill:none;stroke:#52667d;stroke-width:3;marker-end:url(#arrow)}
    .tag{font-size:15px;font-weight:650}.foot{font-size:18px;font-weight:650}
  </style>
  <rect width="1320" height="980" rx="24" fill="#f5f8fc"/>
  <rect x="52" y="43" width="8" height="64" rx="4" fill="#2264b5"/>
  <text x="79" y="69" class="title">From a guarded action to a reviewable release</text>
  <text x="79" y="103" class="subtitle">Follow the arrows. Each step produces evidence for the next.</text>
  <text x="52" y="145" class="small">WORKFLOW MAP · Steps below are requirements, not a release-status report.</text>

  <g>
    <rect x="52" y="179" width="368" height="242" rx="20" fill="#eaf2ff" stroke="#b4cdf0" class="card"/>
    <circle cx="92" cy="220" r="23" fill="#2264b5"/><text x="92" y="228" text-anchor="middle" class="number">1</text>
    <text x="132" y="225" class="step" fill="#17549a">DEFINE + TRANSLATE</text>
    <text x="79" y="271" class="heading">One trusted boundary</text>
    <text x="79" y="310" class="body">Guard device requests in the host.</text>
    <text x="79" y="339" class="body">Generate bundled locale messages.</text>
    <rect x="79" y="366" width="282" height="30" rx="15" fill="#d5e5fb"/>
    <text x="94" y="387" class="tag">Output: code + language catalogs</text>
  </g>
  <path d="M432 299H463" class="flow"/>
  <g>
    <rect x="476" y="179" width="368" height="242" rx="20" fill="#e8f6f2" stroke="#a8d7c9" class="card"/>
    <circle cx="516" cy="220" r="23" fill="#177660"/><text x="516" y="228" text-anchor="middle" class="number">2</text>
    <text x="556" y="225" class="step" fill="#11634f">TEST WITHOUT ACTUATION</text>
    <text x="503" y="271" class="heading">Fake Home Assistant</text>
    <text x="503" y="310" class="body">Count service calls, including races.</text>
    <text x="503" y="339" class="body">Blocked requests must send zero.</text>
    <rect x="503" y="366" width="282" height="30" rx="15" fill="#cdece2"/>
    <text x="518" y="387" class="tag">Output: command-boundary tests</text>
  </g>
  <path d="M856 299H887" class="flow"/>
  <g>
    <rect x="900" y="179" width="368" height="242" rx="20" fill="#f0ecfc" stroke="#cbbde9" class="card"/>
    <circle cx="940" cy="220" r="23" fill="#7350aa"/><text x="940" y="228" text-anchor="middle" class="number">3</text>
    <text x="980" y="225" class="step" fill="#614094">CHECK REAL BROWSERS</text>
    <text x="927" y="271" class="heading">Persist + localize</text>
    <text x="927" y="310" class="body">Reload, sibling tabs, denied storage.</text>
    <text x="927" y="339" class="body">Check language switching and RTL.</text>
    <rect x="927" y="366" width="248" height="30" rx="15" fill="#e0d7f5"/>
    <text x="942" y="387" class="tag">Output: browser regression logs</text>
  </g>
  <path d="M1084 434V516" class="flow"/>
  <text x="1045" y="469" text-anchor="end" class="small">Keep evidence with the</text>
  <text x="1045" y="492" text-anchor="end" class="small">exact source revision.</text>

  <g>
    <rect x="900" y="537" width="368" height="242" rx="20" fill="#fff1e6" stroke="#edc5a5" class="card"/>
    <circle cx="940" cy="578" r="23" fill="#af5b1f"/><text x="940" y="586" text-anchor="middle" class="number">4</text>
    <text x="980" y="583" class="step" fill="#914713">PACKAGE THE KNOWLEDGE</text>
    <text x="927" y="629" class="heading">Docs that travel</text>
    <text x="927" y="668" class="body">Check links, SVG and every README.</text>
    <text x="927" y="697" class="body">Recheck the extracted source ZIP.</text>
    <rect x="927" y="724" width="282" height="30" rx="15" fill="#f9dfc9"/>
    <text x="942" y="745" class="tag">Output: complete, checked archive</text>
  </g>
  <path d="M887 657H856" class="flow"/>
  <g>
    <rect x="476" y="537" width="368" height="242" rx="20" fill="#e6f4f9" stroke="#abd4e4" class="card"/>
    <circle cx="516" cy="578" r="23" fill="#176e8d"/><text x="516" y="586" text-anchor="middle" class="number">5</text>
    <text x="556" y="583" class="step" fill="#155d76">SUBMIT FOR REVIEW</text>
    <text x="503" y="629" class="heading">Signed source changes</text>
    <text x="503" y="668" class="body">Explain behavior, evidence and limits.</text>
    <text x="503" y="697" class="body">Review code and diagrams together.</text>
    <rect x="503" y="724" width="287" height="30" rx="15" fill="#cfe8f2"/>
    <text x="518" y="745" class="tag">Output: an inspectable pull request</text>
  </g>
  <path d="M463 657H432" class="flow"/>
  <g>
    <rect x="52" y="537" width="368" height="242" rx="20" fill="#fff8e5" stroke="#c5a14a" stroke-dasharray="7 5" class="card"/>
    <circle cx="92" cy="578" r="23" fill="#89640b"/><text x="92" y="586" text-anchor="middle" class="number">6</text>
    <text x="132" y="583" class="step" fill="#725209">PASS THE RELEASE GATE</text>
    <text x="79" y="629" class="heading">Verify before publishing</text>
    <text x="79" y="668" class="body">Require CI and release acceptance.</text>
    <text x="79" y="697" class="body">A local pass alone is not a release.</text>
    <rect x="79" y="724" width="281" height="30" rx="15" fill="#f4e7bb"/>
    <text x="94" y="745" class="tag">Output: eligible release evidence</text>
  </g>

  <rect x="52" y="832" width="1216" height="100" rx="18" fill="#fff" stroke="#d4dfe9"/>
  <path d="M81 862V896M72 869L81 861 90 869M72 889L81 897 90 889" fill="none" stroke="#177660" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="110" y="871" class="foot">Always separate live readings from device commands.</text>
  <text x="110" y="900" class="body">A blocked click reports “no command sent”; it never invents a successful device state.</text>
</svg>

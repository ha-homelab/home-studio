name: Safari compatibility observation
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Disposable macOS runner for this observation
        type: choice
        options:
          - macos-15
          - macos-26
          - macos-26-intel
        default: macos-15
      canvas_diagnostic:
        description: Collect native canvas diagnostics without claiming application acceptance
        type: boolean
        default: false
      cold_canvas:
        description: Skip hosted preflight only for the independent canvas diagnostic
        type: boolean
        default: false
      linux_i18n:
        description: Run only the isolated Linux language browser diagnostic
        type: boolean
        default: false
      i18n_lifecycle:
        description: Diagnose Linux language browser lifecycle without claiming application acceptance
        type: boolean
        default: false
      i18n_channels:
        description: Compare Chromium headless modes without claiming application acceptance
        type: boolean
        default: false
  schedule:
    - cron: '37 4 * * 2'
permissions:
  contents: read
jobs:
  safari:
    if: ${{ inputs.linux_i18n != true && inputs.i18n_lifecycle != true && inputs.i18n_channels != true }}
    name: Safari (${{ inputs.runner || 'macos-15' }}, installed stable observation)
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install fixture tooling and check Safari protocol support
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/test-safari-tooling.py
      - name: Compile read-only GUI probe before starting Safari
        if: ${{ inputs.canvas_diagnostic == true }}
        timeout-minutes: 1
        run: |
          python3 scripts/test-compile-macos-gui-health.py
          mkdir -p acceptance-artifacts/safari
          python3 scripts/compile-macos-gui-health.py --output "$RUNNER_TEMP/home-studio-gui-health" > acceptance-artifacts/safari/gui-health-build.json
      - name: Enable WebDriver on this disposable hosted runner
        run: sudo /usr/bin/safaridriver --enable
      - name: Test installed Safari with both viewers and the 256-item planner
        if: ${{ inputs.canvas_diagnostic != true }}
        run: python3 scripts/test-safari-acceptance.py --prepare-hosted-safari --output acceptance-artifacts/safari
      - name: Diagnose independent native canvas paths
        if: ${{ inputs.canvas_diagnostic == true }}
        env:
          COLD_CANVAS: ${{ inputs.cold_canvas }}
        run: |
          python3 scripts/test-safari-canvas-diagnostic.py
          preparation_args=()
          if [[ "$COLD_CANVAS" != "true" ]]; then
            preparation_args+=(--prepare-hosted-safari)
          fi
          python3 scripts/diagnose-safari-canvas.py "${preparation_args[@]}" --output acceptance-artifacts/safari --window-geometry-comparison --gui-health-executable "$RUNNER_TEMP/home-studio-gui-health"
      - name: Preserve actual Safari identity and diagnostics
        if: ${{ always() }}
        uses: ./.github/actions/upload-acceptance-artifact
        with:
          name: safari-${{ inputs.runner || 'macos-15' }}-${{ inputs.canvas_diagnostic && 'canvas-diagnostic' || 'observation' }}
          path: acceptance-artifacts/safari/
          if-no-files-found: error
          retention-days: 14
  linux-i18n:
    if: ${{ inputs.linux_i18n == true || inputs.i18n_lifecycle == true || inputs.i18n_channels == true }}
    name: Isolated Linux language browser diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.i18n_lifecycle || inputs.i18n_channels) && 18 || 12 }}
    steps:
      - name: Record bounded environment before setup
        timeout-minutes: 1
        run: |
          timeout 10s free -m
          timeout 10s ps -eo comm= | sort -u | sed -n '1,80p'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install isolated Chromium test tools
        timeout-minutes: 8
        run: |
          python3 scripts/prepare-ubuntu-apt.py
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Diagnose language browser lifecycle in isolation
        if: ${{ inputs.i18n_lifecycle != true && inputs.i18n_channels != true }}
        timeout-minutes: 6
        env:
          DEBUG: pw:browser
        run: node scripts/test-i18n-browser.cjs
      - name: Compare bounded language browser lifecycle or headless mode observations
        if: ${{ inputs.i18n_lifecycle == true || inputs.i18n_channels == true }}
        timeout-minutes: 6
        run: |
          node --test scripts/test-i18n-lifecycle-diagnostic.cjs
          node scripts/diagnose-i18n-lifecycle.cjs --output acceptance-artifacts/i18n-lifecycle ${{ inputs.i18n_channels && '--compare-browser-channels' || '' }}
      - name: Preserve language browser lifecycle diagnostics
        if: ${{ always() && (inputs.i18n_lifecycle == true || inputs.i18n_channels == true) }}
        uses: ./.github/actions/upload-acceptance-artifact
        with:
          name: i18n-lifecycle-diagnostic
          path: acceptance-artifacts/i18n-lifecycle/
          if-no-files-found: error
          retention-days: 14
      - name: Record bounded environment after diagnostic
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          timeout 10s free -m
          timeout 10s ps -eo comm= | sort -u | sed -n '1,80p'

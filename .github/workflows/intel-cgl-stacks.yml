name: Diagnostic Intel CGL first-load stacks
run-name: Non-release Intel Firefox ESR first-load stacks · ${{ github.sha }}

on:
  push:
    branches: [diagnostic/intel-cgl-stacks]

permissions:
  contents: read

concurrency:
  group: diagnostic-intel-cgl-stacks
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sample:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/intel-cgl-stacks' }}
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      NATIVE_STARTUP_DIAGNOSTICS: '1'
      FIREFOX_RENDERER_VISIBILITY: unmasked
      FIREFOX_WEBGL_BACKEND: default
      FIREFOX_COMPOSITOR_BACKEND: software
      FIREFOX_GPU_PROCESS: disabled
    steps:
      - name: Check out the diagnostic wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - name: Check out the exact original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 7b7a896225aaf27fef26a135d654dfaddffe2c08
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Validate wrapper without capturing processes
        run: python3 harness/scripts/test-intel-cgl-stacks.py
      - name: Prepare the same ephemeral Intel environment
        run: python3 source/scripts/prepare-intel-macos-ci.py --output harness/diagnostics/intel-cgl-stacks/intel-preparation
      - name: Install original fixture tools and verified Firefox ESR
        env:
          INSTALL_DIR: ${{ runner.temp }}/home-studio-intel-cgl-stacks-browser
        run: |
          npm --prefix source ci --ignore-scripts --no-audit --no-fund
          python3 source/scripts/setup-native-browser.py --product firefox --version 153.5.0esr --output "$INSTALL_DIR" > harness/diagnostics/intel-cgl-stacks/install.log 2>&1
          cp "$INSTALL_DIR/install.json" harness/diagnostics/intel-cgl-stacks/install.json
      - name: Run one original viewer case with bounded stack sampling
        env:
          INSTALL_DIR: ${{ runner.temp }}/home-studio-intel-cgl-stacks-browser
        run: >-
          python3 harness/scripts/run-intel-cgl-stacks.py
          --source "$GITHUB_WORKSPACE/source"
          --installation "$INSTALL_DIR/install.json"
          --output "$GITHUB_WORKSPACE/harness/diagnostics/intel-cgl-stacks"
      - name: Preserve the original result and all sampling outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-intel-cgl-stacks-firefox-153.5.0esr-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness/diagnostics/intel-cgl-stacks/
          if-no-files-found: error
          retention-days: 14

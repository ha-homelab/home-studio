name: Isolated Safari canvas diagnostic
on:
  push:
    branches: [diagnostic/safari-canvas-20261030]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo /usr/bin/safaridriver --enable
      - run: python3 scripts/diagnose-safari-canvas.py --output acceptance-artifacts/safari-canvas
      - name: Preserve diagnostic evidence
        if: ${{ always() }}
        uses: ./.github/actions/upload-acceptance-artifact
        with:
          name: safari-canvas-diagnostic
          path: acceptance-artifacts/safari-canvas/
          if-no-files-found: error
          retention-days: 14

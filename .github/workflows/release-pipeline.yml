      }}
    uses: ./.github/workflows/closed-build.yml
    permissions:
      contents: read
      actions: read
    with:
      action: build
      closed_request: ${{ needs.prepare.outputs.closed_request }}
      release_plan_artifact: ${{ needs.prepare.outputs.plan_artifact }}
      release_tag: ''
      public_context_artifact: ''
  closed_stable_resolve:
    needs:
      - prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build
      == 'false' && needs.prepare.outputs.closed_required == 'true' && github.repository == 'ha-homelab/home-studio'
      && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - *id002
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - name: Verify the existing public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_closed.py resolve --purpose stable --output "$RUNNER_TEMP/closed-public-context"
      - name: Stage verified public inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closed-public-context-stable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/closed-public-context/
          if-no-files-found: error
          retention-days: 7
  closed_stable_validate:
    needs:
      - prepare
      - closed_stable_resolve
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build
      == 'false' && needs.prepare.outputs.closed_required == 'true' && github.repository == 'ha-homelab/home-studio'
      && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
      && needs.closed_stable_resolve.result == 'success' }}
    uses: ./.github/workflows/closed-build.yml
    permissions:
      contents: read
      actions: read
    with:
      action: validate
      closed_request: ${{ needs.prepare.outputs.closed_request }}
      release_plan_artifact: ''
      release_tag: ${{ inputs.rc_tag }}
      public_context_artifact: closed-public-context-stable-${{ github.run_id }}-${{ github.run_attempt }}
  closed_existing_resolve:
    needs:
      - closed_request
    if: ${{ !cancelled() && needs.closed_request.result == 'success' && needs.closed_request.outputs.operation ==
      'closed-rebuild' && needs.closed_request.outputs.closed_required == 'true' && github.repository == 'ha-homelab/home-studio'
      && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - *id002
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - name: Verify the existing public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_closed.py resolve --purpose rebuild --output "$RUNNER_TEMP/closed-public-context"
      - name: Stage verified public inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closed-public-context-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/closed-public-context/
          if-no-files-found: error
          retention-days: 7
  closed_rebuild:
    needs:
      - closed_request
      - closed_existing_resolve
    if: ${{ !cancelled() && needs.closed_request.result == 'success' && needs.closed_request.outputs.operation ==
      'closed-rebuild' && needs.closed_request.outputs.closed_required == 'true' && github.repository == 'ha-homelab/home-studio'
      && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
      && needs.closed_existing_resolve.result == 'success' }}
    uses: ./.github/workflows/closed-build.yml
    permissions:
      contents: read
      actions: read
    with:
      action: rebuild
      closed_request: ${{ needs.closed_request.outputs.closed_request }}
      release_plan_artifact: ''
      release_tag: ${{ needs.closed_request.outputs.release_tag }}
      public_context_artifact: closed-public-context-rebuild-${{ github.run_id }}-${{ github.run_attempt }}

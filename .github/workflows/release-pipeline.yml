# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release pipeline
run-name: "Release ${{ inputs.channel || github.event_name }} \xB7 ${{ github.sha }}"
'on':
  push:
    branches:
      - main
  schedule:
    - cron: 13 4 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Release channel
        options:
          - nightly
          - beta
          - rc
          - stable
        default: rc
        required: true
      version:
        type: string
        description: Base X.Y.Z (defaults to committed project version)
        required: false
      rc_tag:
        type: string
        description: 'For stable only: checked vX.Y.Z-rc.N'
        required: false
      expected_sha:
        type: string
        description: Optional exact default-branch SHA; the local CLI fills this to detect ref movement
        required: false
      operation:
        type: choice
        description: Release or rebuild closed inputs against an existing release
        options:
          - release
          - closed-rebuild
        default: release
        required: true
      closed_request:
        type: string
        description: Optional opaque request ID; empty uses the approved default
        required: false
      existing_release:
        type: string
        description: 'For closed-rebuild only: exact published version tag'
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max
jobs:
  closed_request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      operation: ${{ steps.request.outputs.operation }}
      closed_required: ${{ steps.request.outputs.closed_required }}
      closed_request: ${{ steps.request.outputs.closed_request }}
      release_tag: ${{ steps.request.outputs.release_tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - &id002
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: request
        run: python3 scripts/release_closed.py request
  scope:
    name: Change scope
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Classify documentation and build inputs
        env:
          DOCUMENTATION_PATHS: '[]'
          REQUIRED_PATHS: '[]'
          FORCE_FULL: 'true'
        run: |
          args=()
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force); fi
          python3 scripts/change_scope.py "${args[@]}" --documentation-paths-json "$DOCUMENTATION_PATHS" --required-paths-json "$REQUIRED_PATHS"
    needs: closed_request
    if: ${{ !cancelled() && needs.closed_request.result == 'success' && needs.closed_request.outputs.operation ==
      'release' }}
  prepare:
    needs:
      - scope
      - closed_request
    if: ${{ !cancelled() && needs.closed_request.result == 'success' && needs.scope.result == 'success' && needs.scope.outputs.run
      == 'true' && needs.closed_request.outputs.operation == 'release' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      status: ${{ steps.metadata.outputs.status }}
      plan_artifact: ${{ steps.metadata.outputs.plan_artifact }}
      closed_required: ${{ needs.closed_request.outputs.closed_required }}
      closed_request: ${{ needs.closed_request.outputs.closed_request }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - id: metadata
        run: python3 scripts/release_versioned.py prepare --repo "$GITHUB_REPOSITORY"
        env:
          PUBLICATION_ENABLED: ${{ vars.RELEASE_CHANNELS_ENABLED }}
          GH_TOKEN: ${{ github.token }}
      - name: Store exact version plan before building
        if: ${{ steps.metadata.outputs.build == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.plan_artifact }}
          path: .release-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
    permissions:
      contents: write
      actions: read
  checks:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' || needs.prepare.outputs.status == 'version-required' }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      force-full: true
    permissions:
      contents: read
      actions: read
      security-events: write
  build:
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      release_plan_artifact: ${{ needs.prepare.outputs.plan_artifact }}
  gate:
    name: Release gate
    needs:
      - prepare
      - checks
      - build
      - fuzz
    if: ${{ always() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.status == 'version-required')
      }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - env:
          RESULTS: ${{ toJSON(needs) }}
          FUZZ_REQUIRED: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch'
            && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = dict.fromkeys(('prepare', 'checks', 'build'), 'success')
          if results.get('prepare', {}).get('outputs', {}).get('status') == 'version-required':
              expected['build'] = 'skipped'
          expected['fuzz'] = 'success' if os.environ['FUZZ_REQUIRED'] == 'true' else 'skipped'
          if set(results) != set(expected):
              raise SystemExit('Release job inventory differs')
          failed = {name: results.get(name, {}).get('result') for name, result in expected.items() if results.get(name, {}).get('result') != result}
          if failed:
              raise SystemExit(f'Release blocked: {failed}')
          PY
  candidate:
    needs:
      - prepare
      - gate
      - closed_build
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.prepare.outputs.build == 'true' && needs.prepare.outputs.channel
      != 'stable' && vars.RELEASE_CHANNELS_ENABLED == 'true' && needs.prepare.result == 'success' && ((needs.prepare.outputs.closed_required
      == 'true' && needs.closed_build.result == 'success') || (needs.prepare.outputs.closed_required == 'false'
      && needs.closed_build.result == 'skipped')) }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - &id001
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - name: Download the plan used by every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish checked candidate
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_versioned.py publish --repo "$GITHUB_REPOSITORY" --assets .release-assets
      - name: Store immutable promotion evidence
        if: ${{ steps.publication.outputs.status != 'superseded' && steps.publication.outputs.status != 'reused'
          }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  stable:
    needs:
      - prepare
      - closed_stable_validate
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build
      == 'false' && ((needs.prepare.outputs.closed_required == 'true' && needs.closed_stable_validate.result ==
      'success') || (needs.prepare.outputs.closed_required == 'false' && needs.closed_stable_validate.result ==
      'skipped')) }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - *id001
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - name: Promote RC bytes after approval
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: python3 scripts/release_control.py promote --repo "$GITHUB_REPOSITORY" --rc "$RC_TAG" --run-id "$GITHUB_RUN_ID"
      - name: Bind the unchanged RC to this public promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_closed.py record-promotion --output "$RUNNER_TEMP/release-promotion/promotion.json"
      - name: Store immutable public promotion evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-promotion-evidence
          path: ${{ runner.temp }}/release-promotion/promotion.json
          if-no-files-found: error
          retention-days: 90
  final:
    needs:
      - prepare
      - gate
      - closed_build
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build
      == 'true' && needs.prepare.result == 'success' && ((needs.prepare.outputs.closed_required == 'true' && needs.closed_build.result
      == 'success') || (needs.prepare.outputs.closed_required == 'false' && needs.closed_build.result == 'skipped'))
      }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS
      || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Install the qualified GitHub CLI
        env:
          GODEBUG: fips140=on
        run: |
          python3 scripts/install_release_gh.py --output "$RUNNER_TEMP/release-gh/gh"
          echo "$RUNNER_TEMP/release-gh" >> "$GITHUB_PATH"
          echo "GODEBUG=fips140=on" >> "$GITHUB_ENV"
          echo "GH_HOST=github.com" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-gh-config"
          echo "GH_CONFIG_DIR=$RUNNER_TEMP/release-gh-config" >> "$GITHUB_ENV"
      - name: Download the plan used by every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets*
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish the separately validated final packages after approval
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_versioned.py publish --repo "$GITHUB_REPOSITORY" --assets .release-assets
      - name: Store immutable promotion evidence
        if: ${{ steps.publication.outputs.status != 'superseded' && steps.publication.outputs.status != 'reused'
          }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
    environment: release
  fuzz:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' && github.event.repository.private == false && github.event_name
      == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c # main
    with:
      toolkit-ref: 6b2d99519d513d2b871d2a845ddd6134dea4af2c
      release-plan-artifact: ${{ needs.prepare.outputs.plan_artifact }}
    permissions:
      contents: read
  closed_build:
    needs:
      - prepare
      - gate
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.gate.result == 'success' && needs.prepare.outputs.build

name: Diagnostic Intel CGL first connected state
run-name: Non-release Intel first connected state pairs with common indexing state · ${{ github.sha }}

on:
  push:
    branches: [diagnostic/intel-cgl-states-first]

permissions:
  contents: read

concurrency:
  group: diagnostic-intel-cgl-states-first
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  compare:
    name: ${{ matrix.product }} · ${{ matrix.candidate }}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/intel-cgl-states-first' }}
    runs-on: macos-15-intel
    # Two sequential original three-case suites per VM; their own limits
    # are unchanged. Only one Firefox pair is dispatched.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - product: firefox
            version: 153.5.0esr
            candidate: states-first
            revision: c21669ccead7774a588f114c630db54082617fee
    env:
      PYTHONUTF8: '1'
      NATIVE_STARTUP_DIAGNOSTICS: '1'
      FIREFOX_RENDERER_VISIBILITY: unmasked
      FIREFOX_WEBGL_BACKEND: default
      FIREFOX_COMPOSITOR_BACKEND: software
      FIREFOX_GPU_PROCESS: disabled
    steps:
      - name: Check out the diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - name: Check out the exact common baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 7b7a896225aaf27fef26a135d654dfaddffe2c08
          path: baseline
          persist-credentials: false
      - name: Check out the exact independent candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.revision }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Record tooling and prepare both fixtures before timing
        run: |
          mkdir -p harness/diagnostics/intel-cgl-states-first
          {
            python3 --version
            node --version
            npm --version
            uname -sm
            sw_vers
          } > harness/diagnostics/intel-cgl-states-first/toolchain.log 2>&1
          npm --prefix baseline ci --ignore-scripts --no-audit --no-fund 2>&1 | tee harness/diagnostics/intel-cgl-states-first/baseline-npm.log
          npm --prefix candidate ci --ignore-scripts --no-audit --no-fund 2>&1 | tee harness/diagnostics/intel-cgl-states-first/candidate-npm.log
          python3 harness/scripts/test-intel-cgl-states-first.py
          node harness/scripts/test-first-natural-render.cjs
          node candidate/scripts/test-viewer-startup.cjs
      - name: Install one original checksum and signature verified browser per pair
        env:
          INSTALL_DIR: ${{ runner.temp }}/home-studio-intel-cgl-states-first-browser
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.version }}
        run: |
          python3 baseline/scripts/setup-native-browser.py --product "$PRODUCT" --version "$VERSION" --output "$INSTALL_DIR" 2>&1 | tee harness/diagnostics/intel-cgl-states-first/install.log
          cp "$INSTALL_DIR/install.json" harness/diagnostics/intel-cgl-states-first/install.json
      - name: Normalize indexing once and run both original native suites
        env:
          INSTALL_DIR: ${{ runner.temp }}/home-studio-intel-cgl-states-first-browser
          PRODUCT: ${{ matrix.product }}
          CANDIDATE: ${{ matrix.candidate }}
        run: >-
          python3 harness/scripts/run-intel-cgl-states-first.py
          --source-root "$GITHUB_WORKSPACE"
          --candidate "$CANDIDATE" --product "$PRODUCT"
          --installation "$INSTALL_DIR/install.json"
          --output "$GITHUB_WORKSPACE/harness/diagnostics/intel-cgl-states-first"
      - name: Preserve all non-release evidence even when a source fails
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-intel-cgl-states-first-${{ matrix.product }}-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness/diagnostics/intel-cgl-states-first/
          if-no-files-found: error
          retention-days: 14

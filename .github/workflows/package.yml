name: Validate complete package
on:
  workflow_call:

permissions:
  contents: read
jobs:
  closed-contracts:
    name: Closed worker synthetic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked transport test dependencies
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r requirements-closed-build.txt'
      - name: Verify synthetic transport and failure confidentiality
        run: python3 scripts/test_closed_build.py
      - name: Preload public toolchain
        run: python3 scripts/closed_build.py --action prepare --prepared-root "$RUNNER_TEMP/closed-synthetic-public"
      - name: Verify real unprivileged network-disabled container with fictional input
        env:
          CLOSED_DOCKER_TEST: '1'
        run: python3 scripts/test_closed_build.py
  native-core:
    name: Native integration · Home Assistant Core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install pinned HA test runtime
        run: python -m pip install -r requirements-ha-test.txt
      - name: Verify real storage, registries, permissions and publication
        run: python scripts/test-ha-core.py
  platforms:
    uses: ./.github/workflows/platform-acceptance.yml
  package:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Python common errors
        run: |
          python3 -m pip install ruff==0.14.0
          python3 -m ruff check --select F --ignore-noqa scripts ai_companion
      - name: Test strict download transport with synthetic certificate chains
        run: |
          python3 -m pip install -r requirements-tls-test.txt
          python3 scripts/test-download-tls.py
      - name: Check published sources and website
        run: python3 scripts/validate-site.py
      - name: Test native drafts, publication, package and permissions
        run: |
          python3 scripts/test-ha-project-metadata.py
          python3 scripts/test-ha-native.py
      - name: Test archive validation, installation, backup and rollback
        run: python3 scripts/test-install-home-assistant.py
      - name: Test ephemeral Intel runner preparation without system commands
        run: python3 scripts/test-intel-macos-ci.py
      - name: Build and install a fictional home in an isolated directory
        run: python3 scripts/test-public-package.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Replay fuzz regression inputs without mutation campaigns
        run: node --test fuzz/*.test.mjs
      - name: Run bundled CPU regressions from the extracted public source ZIP
        run: python3 scripts/test_source_replay.py
      - name: Check generated catalog and furniture export parity
        run: |
          python3 scripts/generate-furniture-catalog.py --check
          python3 scripts/test-furniture.py
          python3 scripts/test-furniture-patterns.py
          node scripts/test-furniture-patterns.mjs
          python3 scripts/test-inventory-appearance.py
          node --test scripts/test-inventory-appearance.cjs
      - name: Check localized guides, wiki links and vector diagrams
        run: |
          python3 scripts/test-docs.py
          python3 scripts/validate-docs.py
      - name: Check translation coverage and placeholders
        run: |
          python3 scripts/build-panel-locales.py --check
          node scripts/test-i18n.mjs
          node scripts/test-validation-i18n.mjs
          node --test scripts/test-panel-language.cjs
      - name: Test AI draft validation and companion security without provider calls
        run: |
          node scripts/test-ai-draft.mjs
          python3 scripts/test-ai-companion.py
      - name: Install browser test tools
        timeout-minutes: 12
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Test native editor bridge and family control boundaries
        run: |
          for engine in chromium firefox webkit; do
            BROWSER="$engine" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node scripts/test-native-studio.cjs || exit 1
          done
          node --test scripts/test-family-view.cjs
      - name: Test drawing, furnishing, export and installation through the editor
        run: npm run test:planner
      - name: Test optional garden surroundings and bounded decorative motion
        run: |
          node scripts/test-environment.mjs
          node scripts/test-environment-browser.cjs
      - name: Test AI preview, review, undo and real local companion
        env:
          AI_PLANNER_ENGINES: chromium,firefox
          AI_PLANNER_HEADED: '1'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node scripts/test-ai-planner.cjs
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node scripts/test-ai-integration.cjs
      - name: Test language switching, right-to-left layout and project preservation
        run: node scripts/test-i18n-browser.cjs
      - name: First-room and example workflow
        run: |
          python3 scripts/build-example-modules.py --check
          node scripts/test-onboarding.mjs
          node scripts/test-draft-storage.mjs
          for engine in chromium firefox webkit; do
            PLANNER_EDITING_ENGINE="$engine" node scripts/test-planner-editing.cjs
            ONBOARDING_ENGINE="$engine" ONBOARDING_HEADED=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node scripts/test-onboarding-browser.cjs
          done
      - name: Test floor previews and camera navigation
        run: |
          node scripts/test-planner-navigation.cjs
          node scripts/test-floor-navigator.cjs
          for engine in chromium firefox webkit; do
            PLANNER_NAVIGATION_ENGINES="$engine" PLANNER_NAVIGATION_HEADED=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node scripts/test-floor-navigation.cjs
          done
      - name: Test localized help and offline installed viewer
        run: |
          node scripts/test-help-i18n.cjs
          node scripts/test-viewer-i18n.cjs
      - name: Test dry-run command gate without physical devices
        run: |
          node --test scripts/test-dry-run.cjs
          node --test scripts/test-dry-run-browser.cjs
      - name: Test lock status and native controls without device commands
        run: node scripts/test-lock-control.cjs
      - name: Test bounded diagnostic display with synthetic clocks
        run: node scripts/test-module-expiry.cjs
      - name: Test visible wall outlines and doorway gaps
        run: node scripts/test-wall-tops.cjs
      - name: Test rounded walls, exact shadow geometry and demand-only sheen
        run: |
          node scripts/test-rounded-walls.cjs
          node scripts/test-wall-sheen.cjs
          node scripts/test-wall-motion.cjs
          node scripts/test-wall-outline-materials.cjs
          node scripts/test-unlit-architectural-walls.cjs
          node scripts/test-flat-editor-floors.cjs
      - name: Test dimmed light indicators and color interpretation
        run: node --test scripts/test-light-state.cjs
      - name: Test TV frame retention and disposal
        run: node --test scripts/test-tv-screen.cjs
      - name: Test linked media previews and bounded TV power commands
        run: |
          node --test scripts/test-media-preview.cjs scripts/test-media-artwork-host.cjs scripts/test-media-command-host.cjs
          node --test scripts/test-dashboard-card.cjs
          for engine in chromium firefox webkit; do
            MEDIA_ARTWORK_ENGINE="$engine" node scripts/test-media-artwork-browser.cjs
            MEDIA_CONTROLS_ENGINE="$engine" node scripts/test-media-controls.cjs
          done
      - name: Test generic device bindings and native interaction
        run: |
          node scripts/test-generic-entities.cjs
          for engine in chromium firefox webkit; do
            DEVICE_INTERACTIONS_ENGINE="$engine" DEVICE_INTERACTIONS_HEADED=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node scripts/test-device-interactions.cjs
          done
      - name: Test muted lower-floor context and independent camera focus
        run: python3 scripts/test-floor-context.py && node --test scripts/test-floor-context.cjs
      - name: Test initial viewer mode and first-render fallback
        run: node scripts/test-viewer-startup.cjs
      - name: Test render budgets and page lifecycle
        run: |
          node scripts/test-home-render-budget.cjs
          node scripts/test-packed-room-lighting.cjs
          node scripts/test-zero-point-block.cjs
          node scripts/test-point-decay-two.cjs
          node scripts/test-cached-shadow-transmission.cjs
          node scripts/test-literal-lambert-directional.cjs
          node scripts/test-glass-wall-program.cjs
          node scripts/test-fallback-shared-program.cjs
          node scripts/test-point-texture-current.cjs
          node scripts/test-point-run-texture.cjs
          node scripts/test-static-geometry-atlas.cjs
          node scripts/test-point-signal-texture.cjs
          node scripts/test-signal-texture-decay-two.cjs
          node scripts/test-literal-lambert-point-body.cjs
          node scripts/test-scalar-shadow-point.cjs
          node scripts/test-scalar-indirect-lambert.cjs
          node scripts/test-direct-shadow-uniforms.cjs
          node scripts/test-scalar-lambert-accumulators.cjs
          node scripts/test-render-lifecycle.cjs
          node scripts/test-pointer-ownership.cjs
          node scripts/test-viewer-geometry-context.cjs
          node scripts/test-viewer-texture-context.cjs
          node scripts/test-interaction-render.cjs
          node scripts/test-native-viewer-programs.cjs
          node --test scripts/test-render-capacity.cjs
          node --test scripts/test-browser-stability-diagnostics.cjs
          node --test scripts/test-browser-startup-diagnostics.cjs
      - name: Test planner drawing and preview resource budgets
        run: node scripts/test-planner-render-budget.cjs
      - name: Test bounded native draw diagnostics without a browser
        run: |
          python3 scripts/test-native-draw-diagnostic.py
          node --test scripts/test-native-draw-diagnostic.cjs
      - name: Test deterministic public source release
        run: python3 scripts/test_package_release.py

name: Validate complete package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check published sources and website
        run: python3 scripts/validate-site.py
      - name: Test archive validation, installation, backup and rollback
        run: python3 scripts/test-install-home-assistant.py
      - name: Build and install a fictional home in an isolated directory
        run: python3 scripts/test-public-package.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Test bounded diagnostic display with synthetic clocks
        run: node scripts/test-module-expiry.cjs
      - name: Test visible wall outlines and doorway gaps
        run: node scripts/test-wall-tops.cjs
      - name: Test passive wall sheen and lighting composition
        run: node scripts/test-wall-sheen.cjs
      - name: Test TV frame retention and disposal
        run: node --test scripts/test-tv-screen.cjs
      - name: Test linked media previews and bounded TV power commands
        run: node --test scripts/test-media-preview.cjs

name: Upload acceptance artifact with one transport retry
description: Preserve the existing result files; retry only their upload once.
inputs:
  name:
    description: Unique artifact name for this acceptance job.
    required: true
  path:
    description: Completed acceptance output directory.
    required: true
  if-no-files-found:
    description: Preserve the caller's missing-file policy.
    default: error
  retention-days:
    description: Preserve the caller's retention period.
    default: '14'
runs:
  using: composite
  steps:
    - name: Upload the completed acceptance evidence
      id: primary
      if: ${{ always() }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: false
    - name: Record the failed transport attempt
      if: ${{ !cancelled() && steps.primary.outcome == 'failure' }}
      shell: bash
      run: echo '::warning::Acceptance artifact upload failed; retrying transport once with the same completed files. No browser or test is rerun. A same-name partial artifact may be replaced.'
    - name: Retry acceptance evidence transport once
      id: fallback
      if: ${{ !cancelled() && steps.primary.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
